name: Android test APK

# Builds an installable test APK and attaches it to the "test-apk" release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kkuk-test.apk
          gh release delete test-apk --yes --cleanup-tag || true
          gh release create test-apk kkuk-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "테스트용 APK" --notes "테스트용 설치 파일이에요. 커밋 $GITHUB_SHA"
